{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="card p-5 text-center my-4">
  <i class="bi bi-exclamation-circle text-warning display-1 mb-3"></i>
  <h2 class="fw-bold text-dark">404 - Requested Page Not Found</h2>
  <p class="text-muted">The requested disaster management resource or dashboard endpoint does not exist.</p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
